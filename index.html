    <script>
      (function(){
        var p = location.pathname;
        var m = '/manifest.json', a = '/pwa-192x192.png', t = '#243529';
        if (p.startsWith('/delivery')) { m = '/manifest-delivery.json'; a = '/pwa-delivery-192x192.png'; t = '#1e3a5f'; }
        else if (p.startsWith('/admin')) { m = '/manifest-admin.json'; a = '/pwa-admin-192x192.png'; t = '#2d2d2d'; }
        document.getElementById('pwa-manifest').setAttribute('href', m);
        document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', a);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t);
      })();
    </script>

      html,body,#root{min-height:100%;margin:0;background:#faf5e9}

      #initial-splash .mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#243529;color:#faf5e9;font-family:Georgia,serif;font-size:27px;font-weight:700}
      #initial-splash .loader{width:20px;height:20px;border:2px solid #24352930;border-top-color:#243529;border-radius:50%;animation:splash-spin .8s linear infinite;margin:18px auto 0}
